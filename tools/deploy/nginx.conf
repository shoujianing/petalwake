# nginx for the built game (dist/). Used by the Dockerfile; works as a server block anywhere.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/manifest+json webmanifest;
        application/octet-stream  pwz u16 bin;
        model/gltf-binary         glb;
    }

    # text compresses well on the wire; the big binaries are already gzipped by the build (.pwz)
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff; }
    location = /version.json { add_header Cache-Control "no-cache"; }
    location ^~ /c/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff; }
    location ^~ /a/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff; }
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
}
